<style>
:root{--ink:#152a29;--muted:#647572;--brand:#167451;--brand-dark:#0b553c;--surface:#fff;--bg:#f5f7f7;--line:#e1e9e7;--shadow:0 12px 28px rgba(22,64,52,.06);--danger:#ad353b;--focus:#146caa}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.7}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #217ec2;outline-offset:3px}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}header .inner{max-width:1230px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:22px}.logo{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:850;color:var(--brand)}.logo .logo-icon{background:var(--brand);color:#fff;border-radius:12px;padding:4px 10px}.topnav{display:flex;gap:5px;align-items:center;margin-right:auto}.topnav button{border:0;background:transparent;padding:10px 13px;color:#425754;font-weight:650;border-radius:10px}.topnav button:hover,.topnav button.active{background:#e9f5ef;color:var(--brand-dark)}.header-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 17px;background:#fff;font-weight:750;transition:.15s}.btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px #0000000b}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary:hover{background:var(--brand-dark)}.btn.ghost{background:#eef7f2;color:var(--brand-dark);border-color:transparent}.btn.small{padding:7px 11px;font-size:12px}.container{max-width:1230px;margin:auto;padding:27px 22px 70px}.hero{border-radius:24px;background:linear-gradient(115deg,#0b543c,#167451 65%,#259d77);color:#fff;padding:36px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;left:-105px;top:-140px;width:420px;height:420px;border:70px solid #ffffff13;border-radius:50%}.hero .copy{max-width:790px;position:relative}.hero h1{font-size:36px;line-height:1.45;margin:0 0 9px}.hero p{font-size:16px;color:#d8eee4;margin:0 0 25px}.searchbar{display:flex;gap:9px;background:#fff;padding:9px;border-radius:15px;box-shadow:0 14px 38px #00211624;max-width:920px}.searchbar input{border:0;flex:1;min-width:80px;padding:11px 14px;color:var(--ink);outline:none}.searchbar select{border:0;min-width:140px;background:#f4f8f6;border-radius:9px;padding:9px;color:var(--ink)}.searchbar .btn{white-space:nowrap}.section-head{display:flex;justify-content:space-between;align-items:end;margin:27px 0 17px}.section-head h2{font-size:23px;margin:0}.section-head p{color:var(--muted);margin:3px 0 0}.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.category{background:#fff;border:1px solid var(--line);padding:18px 9px;border-radius:15px;text-align:center;transition:.2s}.category:hover,.category.selected{border-color:#58ad86;box-shadow:var(--shadow);background:#f0faf4}.category .emoji{font-size:29px;display:block;margin-bottom:6px}.category strong{display:block}.content-layout{display:grid;grid-template-columns:255px 1fr;gap:22px;align-items:start}.filter-panel,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.filter-panel{padding:19px;position:sticky;top:92px}.filter-panel h3{margin:0 0 12px;font-size:18px}.field{margin-bottom:16px}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d5e0dc;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}.field textarea{min-height:115px;resize:vertical}.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filter-actions{display:flex;gap:7px}.result-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.result-toolbar h2{font-size:21px;margin:0}.result-toolbar select{background:#fff;border:1px solid var(--line);padding:9px;border-radius:9px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.listing{min-width:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow);transition:.2s}.listing:hover{transform:translateY(-2px);box-shadow:0 16px 28px #112f251a}.listing .picture{height:155px;position:relative;background:#eff5f4;overflow:hidden}.listing .picture img{width:100%;height:100%;object-fit:cover}.favorite-btn{position:absolute;top:10px;left:10px;border:0;background:#fff;color:#39524b;border-radius:50%;width:35px;height:35px;font-size:19px;box-shadow:0 3px 10px #0002}.favorite-btn.selected{color:#bc3e59}.listing-info{padding:15px}.listing-info h3{font-size:15px;margin:0 0 10px;min-height:48px;line-height:1.5}.price{color:#076c48;font-size:20px;font-weight:850;line-height:1.3}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:9px 0 12px}.tag{display:inline-block;border-radius:50px;background:#eff7f2;padding:3px 10px;color:var(--brand-dark);font-size:11px}.listing-info .btn{width:100%;margin-top:9px}.empty{text-align:center;padding:55px 20px;background:#fff;border:1px dashed #c7d9d2;border-radius:18px;grid-column:1/-1}.empty strong{display:block;font-size:19px}.empty p{color:var(--muted)}.back{border:0;background:none;color:var(--brand-dark);font-weight:750;padding:8px 0 22px}.detail{display:grid;grid-template-columns:1.3fr .8fr;gap:23px}.detail-image{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:18px;background:#f0f3f4}.detail-side{padding:25px}.detail-side h1{font-size:25px;line-height:1.5;margin:0 0 10px}.detail-side .price{font-size:28px}.detail-side dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-side dt{color:var(--muted);font-size:12px}.detail-side dd{margin:0;font-weight:750}.detail-side .btn{width:100%;margin-top:11px}.description{margin-top:20px;padding:25px}.description h2{margin-top:0}.form-wrap{max-width:780px;margin:auto}.form-wrap .panel{padding:30px}.form-wrap h1{margin-top:0}.note{background:#eff7f3;color:#275c48;border-radius:11px;padding:10px 13px;font-size:12px;margin-bottom:19px}.field small{color:var(--muted);font-size:11px}.field .error{color:var(--danger)}.msg-layout{display:grid;grid-template-columns:300px 1fr;min-height:440px;overflow:hidden}.conversations{border-left:1px solid var(--line);padding:15px}.convo{display:block;text-align:right;width:100%;background:#fff;border:1px solid var(--line);margin:7px 0;border-radius:10px;padding:12px}.convo.selected{background:#ecf6f0;border-color:#a1cdb9}.chat-area{display:flex;flex-direction:column;padding:20px}.chat-bubble{background:#eaf2ed;align-self:flex-start;border-radius:14px 14px 2px 14px;padding:11px 15px;max-width:80%;margin:5px}.chat-bubble.me{background:#1c7958;color:#fff;align-self:flex-end;border-radius:14px 14px 14px 2px}.chat-form{display:flex;gap:10px;margin-top:auto;padding-top:17px}.chat-form input{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px}.footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;text-align:center;padding:18px}.toast{position:fixed;bottom:26px;left:26px;border:1px solid #b5d6c3;border-radius:12px;background:#fff;color:#14533b;padding:13px 20px;box-shadow:0 20px 50px #143d2b26;max-width:340px;z-index:30;display:none}.toast.show{display:block}.disclaimer{font-size:11px;color:#657772;margin:8px 0}.pill{background:#dff2e8;color:#13573c;border-radius:60px;padding:5px 9px;font-size:11px;font-weight:650}header .badge-count{font-weight:750;color:#08734c}.mobile-nav{display:none}.skip{position:absolute;top:-60px;right:10px;background:#fff;z-index:100;padding:10px}.skip:focus{top:5px}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.categories{grid-template-columns:repeat(3,1fr)}}@media(max-width:750px){header .inner{gap:10px;padding:11px 15px}header .logo{font-size:20px}.topnav{display:none}.header-actions .btn:not(.primary){display:none}.container{padding:18px 14px 80px}.hero{padding:27px 19px}.hero h1{font-size:25px}.hero p{font-size:14px}.searchbar{flex-wrap:wrap}.searchbar input{flex-basis:100%}.searchbar select{flex:1;min-width:100px}.categories{grid-template-columns:repeat(3,1fr);gap:8px}.category{padding:12px 5px}.category .emoji{font-size:23px}.content-layout{grid-template-columns:1fr}.filter-panel{position:static}.cards{grid-template-columns:repeat(2,1fr);gap:10px}.listing .picture{height:125px}.listing-info{padding:11px}.listing-info h3{font-size:12px;min-height:55px}.meta{font-size:10px}.price{font-size:17px}.detail,.msg-layout{grid-template-columns:1fr}.conversations{border-left:0;border-bottom:1px solid var(--line)}.detail-side{padding:18px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -5px 20px #0001;justify-content:space-around;padding:8px 0 10px;z-index:12}.mobile-nav button{border:0;background:transparent;color:#385b51;font-size:12px;padding:6px}.footer{padding-bottom:80px}}@media(max-width:400px){.cards{grid-template-columns:1fr}.categories{grid-template-columns:repeat(2,1fr)}}
</style>

<body><a class="skip" href="#main">تجاوز إلى المحتوى</a>
<header><div class="inner"><a class="logo" href="#home" aria-label="العودة للرئيسية"><span class="logo-icon">ح</span><span>حراج<span style="font-size:11px;color:#70877d;margin-right:5px">الجديد</span></span></a><nav class="topnav" aria-label="التنقل الرئيسي"><button data-page="home">الرئيسية</button><button data-page="results">تصفح الإعلانات</button><button data-page="favorites">المفضلة <span id="count" class="badge-count"></span></button><button data-page="messages">الرسائل</button></nav><div class="header-actions"><button class="btn ghost" data-page="favorites">♡ المفضلة</button><button class="btn primary" data-page="post">＋ أضف إعلان</button></div></div></header>
<main id="main" class="container" tabindex="-1" aria-live="polite"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div><nav class="mobile-nav" aria-label="التنقل السفلي"><button data-page="home">⌂ الرئيسية</button><button data-page="results">☷ الإعلانات</button><button data-page="favorites">♡ المفضلة</button><button data-page="messages">▤ الرسائل</button></nav><footer class="footer">نموذج UX تعليمي مستقل لمادة IT352. لا يتبع موقع حراج ولا يتصل بخوادمه. الإعلانات والرسائل تجريبية.</footer>
<script>
'use strict';
const seed=[
{id:101,title:'تويوتا كامري 2022 فل كامل — حالة ممتازة',category:'سيارات',city:'الرياض',price:78500,img:'car',desc:'سيارة بحالة جيدة، استخدام شخصي. الفحص متاح للمشتري الجاد. المعلومات المعروضة لغرض اختبار التصميم فقط.',seller:'مستخدم تجريبي 1',date:'اليوم'},
{id:102,title:'آيفون 15 برو — سعة 256 جيجابايت',category:'إلكترونيات',city:'جدة',price:2950,img:'phone',desc:'جهاز بحالة جيدة مع الملحقات المذكورة. إعلان تجريبي.',seller:'مستخدم تجريبي 2',date:'أمس'},
{id:103,title:'شقة للإيجار السنوي — غرفتان وصالة',category:'عقارات',city:'الدمام',price:32000,img:'home',desc:'شقة مفروشة جزئيًا قريبة من الخدمات. السعر سنوي. إعلان تجريبي.',seller:'مستخدم تجريبي 3',date:'اليوم'},
{id:104,title:'لابتوب للأعمال والدراسة — 16GB RAM',category:'إلكترونيات',city:'الرياض',price:2300,img:'laptop',desc:'جهاز مناسب للدراسة والمكتب، مع الشاحن. إعلان تجريبي.',seller:'مستخدم تجريبي 4',date:'منذ يومين'},
{id:105,title:'سيارة دفع رباعي 2021 — مفحوصة',category:'سيارات',city:'الخبر',price:94000,img:'suv',desc:'سيارة مناسبة للاستخدام العائلي. إعلان تجريبي للاختبارات.',seller:'مستخدم تجريبي 5',date:'اليوم'},
{id:106,title:'كنبة ثلاثية مودرن بلون رمادي',category:'أثاث',city:'جدة',price:1500,img:'sofa',desc:'كنبة نظيفة، الاستلام من موقع البائع. إعلان تجريبي.',seller:'مستخدم تجريبي 6',date:'منذ 3 أيام'},
{id:107,title:'كاميرا تصوير رقمية مع عدسة',category:'إلكترونيات',city:'المدينة',price:3350,img:'camera',desc:'كاميرا تصوير مستعملة بعناية. إعلان تجريبي.',seller:'مستخدم تجريبي 7',date:'أمس'},
{id:108,title:'ساعة ذكية مقاومة للماء',category:'إلكترونيات',city:'الرياض',price:550,img:'watch',desc:'ساعة حديثة للأنشطة اليومية. إعلان تجريبي.',seller:'مستخدم تجريبي 8',date:'اليوم'}
];
const cats=[['الكل','◈'],['سيارات','🚘'],['إلكترونيات','▣'],['عقارات','⌂'],['أثاث','▤']];
function read(key,fallback){try {return JSON.parse(localStorage.getItem('it352_'+key))??fallback}catch{return fallback}}
const state={page:'home',query:'',cat:'الكل',city:'الكل',min:'',max:'',sort:'new',selected:101,chatId:101,favorites:read('favorites',[]),custom:read('listings',[]),messages:read('messages',{}),postPreview:''};
const main=document.querySelector('#main');const icon=(name)=>`assets/${name}.svg`;
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n)=>new Intl.NumberFormat('ar-SA').format(Number(n));const listings=()=>[...state.custom,...seed];
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),3200)}
function nav(page,selected){if(selected!=null)state.selected=Number(selected);state.page=page;location.hash=page+(page==='detail'?'/'+state.selected:'');draw();window.scrollTo(0,0)}
function menu(){document.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('active',el.dataset.page===state.page)});document.getElementById('count').textContent=state.favorites.length?`(${state.favorites.length})`:''}
function favorite(id){if(state.favorites.includes(id))state.favorites=state.favorites.filter(x=>x!==id);else state.favorites.push(id);localStorage.setItem('it352_favorites',JSON.stringify(state.favorites));notify(state.favorites.includes(id)?'تم حفظ الإعلان في المفضلة':'تم إزالة الإعلان من المفضلة');draw()}
function categories(){return `<div class="categories">${cats.map(([name,e])=>`<button class="category ${state.cat===name?'selected':''}" data-cat="${name}" aria-pressed="${state.cat===name}"><span class="emoji" aria-hidden="true">${e}</span><strong>${name}</strong></button>`).join('')}</div>`}
function card(ad){let liked=state.favorites.includes(ad.id);return `<article class="listing"><div class="picture"><img alt="رسم توضيحي للفئة: ${safe(ad.category)}" src="${icon(ad.img)}"><button class="favorite-btn ${liked?'selected':''}" data-fav="${ad.id}" aria-label="${liked?'إزالة من':'حفظ في'} المفضلة" aria-pressed="${liked}">${liked?'♥':'♡'}</button></div><div class="listing-info"><span class="tag">${safe(ad.category)}</span><h3>${safe(ad.title)}</h3><div class="price">${money(ad.price)} ر.س</div><div class="meta"><span>⌖ ${safe(ad.city)}</span><span>${safe(ad.date)}</span></div><button class="btn ghost" data-detail="${ad.id}">عرض التفاصيل</button></div></article>`}
function filtered(){let a=listings().filter(x=>(state.cat==='الكل'||x.category===state.cat)&&(state.city==='الكل'||x.city===state.city)&&(!state.min||x.price>=Number(state.min))&&(!state.max||x.price<=Number(state.max))&&(!state.query||(`${x.title} ${x.category} ${x.city}`).toLowerCase().includes(state.query.toLowerCase())));if(state.sort==='low')a.sort((a,b)=>a.price-b.price);if(state.sort==='high')a.sort((a,b)=>b.price-a.price);return a}
function grid(items,empty='لا توجد إعلانات مطابقة للبحث'){return items.length?`<div class="cards">${items.map(card).join('')}</div>`:`<div class="empty"><strong>${empty}</strong><p>جرب تغيير البحث أو إزالة بعض الفلاتر.</p><button class="btn" data-clear>إعادة ضبط البحث</button></div>`}
function home(){return `<section class="hero"><div class="copy"><span class="pill">تجربة أوضح — خطوات أقل</span><h1>كل ما تبحث عنه،<br>تصل إليه بسهولة</h1><p>ابحث في الإعلانات، قارن الخيارات، وتواصل مع البائع دون تشتت.</p><form id="home-search" class="searchbar"><input id="query-home" aria-label="عبارة البحث" placeholder="ابحث عن سيارة، هاتف، شقة..." value="${safe(state.query)}" required><select id="city-home" aria-label="المدينة">${options(['الكل','الرياض','جدة','الدمام','الخبر','المدينة'],state.city)}</select><button class="btn primary" type="submit">بحث عن إعلانات</button></form></div></section><div class="section-head"><div><h2>تصفح حسب الفئة</h2><p>تصنيف بسيط يساعدك على الوصول أسرع.</p></div></div>${categories()}<div class="section-head"><div><h2>إعلانات يمكنك استكشافها</h2><p>بيانات تجريبية مخصصة للنموذج الأكاديمي</p></div><button class="btn ghost" data-page="results">عرض جميع الإعلانات ←</button></div>${grid(listings().slice(0,6))}`}
function options(arr,selected){return arr.map(x=>`<option value="${safe(x)}" ${x===selected?'selected':''}>${x==='الكل'?'جميع الخيارات':x}</option>`).join('')}
function results(){return `<div class="section-head"><div><h2>تصفح الإعلانات</h2><p>فلترة واضحة لتقليل الوقت وعدد الخطوات.</p></div></div><div class="content-layout"><aside class="filter-panel" aria-label="فلاتر نتائج البحث"><h3>تصفية النتائج</h3><form id="filter-form"><div class="field"><label for="filter-query">كلمة البحث</label><input id="filter-query" value="${safe(state.query)}" placeholder="مثال: كامري"></div><div class="field"><label for="filter-cat">الفئة</label><select id="filter-cat">${options(cats.map(x=>x[0]),state.cat)}</select></div><div class="field"><label for="filter-city">المدينة</label><select id="filter-city">${options(['الكل','الرياض','جدة','الدمام','الخبر','المدينة'],state.city)}</select></div><div class="field"><label>السعر بالريال</label><div class="inline-fields"><input id="filter-min" type="number" min="0" placeholder="من" value="${safe(state.min)}" aria-label="الحد الأدنى للسعر"><input id="filter-max" type="number" min="0" placeholder="إلى" value="${safe(state.max)}" aria-label="الحد الأقصى للسعر"></div></div><div class="filter-actions"><button class="btn primary" type="submit">تطبيق</button><button class="btn" type="button" data-clear>مسح</button></div></form></aside><section><div class="result-toolbar"><h2>${filtered().length} إعلان</h2><label>الترتيب <select id="sort" aria-label="ترتيب الإعلانات"><option value="new" ${state.sort==='new'?'selected':''}>الأحدث أولًا</option><option value="low" ${state.sort==='low'?'selected':''}>السعر: الأقل</option><option value="high" ${state.sort==='high'?'selected':''}>السعر: الأعلى</option></select></label></div>${grid(filtered())}</section></div>`}
function detail(){let a=listings().find(x=>x.id===state.selected);if(!a)return `<div class="empty">الإعلان غير متاح</div>`;return `<button class="back" data-page="results">← العودة إلى الإعلانات</button><section class="detail"><div><img class="detail-image" src="${icon(a.img)}" alt="رسم توضيحي للمنتج: ${safe(a.title)}"><section class="panel description"><h2>وصف الإعلان</h2><p>${safe(a.desc)}</p><p class="disclaimer">الصور والبيانات للعرض التوضيحي فقط. لا يعكس هذا إعلانًا فعليًا على حراج.</p></section></div><aside class="panel detail-side"><span class="tag">${safe(a.category)}</span><h1>${safe(a.title)}</h1><p class="price">${money(a.price)} ر.س</p><hr style="border:0;border-top:1px solid var(--line)"><dl><div><dt>المدينة</dt><dd>${safe(a.city)}</dd></div><div><dt>تاريخ الإعلان</dt><dd>${safe(a.date)}</dd></div><div><dt>صاحب الإعلان</dt><dd>${safe(a.seller)}</dd></div><div><dt>رقم الإعلان</dt><dd>#${a.id}</dd></div></dl><button class="btn primary" data-message="${a.id}">تواصل مع البائع</button><button class="btn" data-fav="${a.id}">${state.favorites.includes(a.id)?'♥ إزالة من المفضلة':'♡ حفظ في المفضلة'}</button><p class="disclaimer">لا ترسل معلومات حساسة؛ المراسلة محلية وتجريبية.</p></aside></section>`}
function favorites(){let a=listings().filter(x=>state.favorites.includes(x.id));return `<div class="section-head"><div><h2>المفضلة</h2><p>الإعلانات المحفوظة لتعود إليها لاحقًا — محفوظة على هذا الجهاز فقط.</p></div></div>${grid(a,'لم تحفظ أي إعلان بعد')}`}
function post(){return `<div class="form-wrap"><button class="back" data-page="home">← العودة للرئيسية</button><form id="post-form" class="panel"><h1>أضف إعلانًا جديدًا</h1><p class="note">نموذج تعليمي. لن يُنشر إعلانك على حراج الحقيقي؛ سيظهر محليًا في هذه النسخة.</p><div class="field"><label for="post-title">عنوان الإعلان *</label><input id="post-title" required minlength="8" maxlength="100" placeholder="مثال: جهاز لابتوب بحالة جيدة"><small>اكتب عنوانًا واضحًا من 8 أحرف على الأقل.</small></div><div class="inline-fields"><div class="field"><label for="post-cat">الفئة *</label><select id="post-cat" required><option value="">اختر الفئة</option>${cats.filter(x=>x[0]!=='الكل').map(x=>`<option>${x[0]}</option>`).join('')}</select></div><div class="field"><label for="post-city">المدينة *</label><select id="post-city" required><option value="">اختر المدينة</option>${options(['الرياض','جدة','الدمام','الخبر','المدينة'],'')}</select></div></div><div class="field"><label for="post-price">السعر (ريال سعودي) *</label><input type="number" id="post-price" min="1" max="10000000" required placeholder="مثال: 2500"></div><div class="field"><label for="post-desc">وصف الإعلان *</label><textarea id="post-desc" required minlength="20" maxlength="1000" placeholder="اذكر حالة المنتج والمواصفات الأساسية..." aria-describedby="desc-help"></textarea><small id="desc-help">وصف لا يقل عن 20 حرفًا.</small></div><button class="btn primary" type="submit">نشر إعلان تجريبي</button></form></div>`}
function messages(){let a=listings().find(x=>x.id===state.chatId)||listings()[0], all=state.messages[state.chatId]||[];return `<div class="section-head"><div><h2>المراسلات</h2><p>محادثات نموذجية محفوظة محليًا في المتصفح.</p></div></div><div class="panel msg-layout"><aside class="conversations"><strong>المحادثات</strong>${listings().slice(0,7).map(x=>`<button class="convo ${x.id===state.chatId?'selected':''}" data-chat="${x.id}">${safe(x.seller)}<br><small>${safe(x.title.slice(0,35))}</small></button>`).join('')}</aside><section class="chat-area"><h3 style="margin:0">${safe(a.seller)}</h3><p class="disclaimer">بشأن: ${safe(a.title)}</p><div class="chat-bubble">مرحبًا! هذه مساحة مراسلة تجريبية لإيضاح التفاعل.</div>${all.map(m=>`<div class="chat-bubble me">${safe(m)}</div>`).join('')}<form class="chat-form" id="chat-form"><input id="chat-text" maxlength="350" required placeholder="اكتب رسالتك التجريبية..." aria-label="اكتب الرسالة"><button class="btn primary" type="submit">إرسال</button></form></section></div>`}
function draw(){menu();main.innerHTML=({home,results,detail,post,favorites,messages}[state.page]||home)();menu();}
function clearFilters(){state.cat='الكل';state.city='الكل';state.query='';state.min='';state.max='';state.sort='new';nav('results');notify('تم مسح الفلاتر')}
document.addEventListener('click',e=>{let t=e.target.closest('[data-page],[data-cat],[data-detail],[data-fav],[data-message],[data-chat],[data-clear]');if(!t)return;const d=t.dataset;if(d.page){e.preventDefault();nav(d.page)}else if(d.cat){state.cat=d.cat;nav('results')}else if(d.detail){nav('detail',d.detail)}else if(d.fav){favorite(Number(d.fav))}else if(d.message){state.chatId=Number(d.message);nav('messages')}else if(d.chat){state.chatId=Number(d.chat);draw()}else if('clear'in d){clearFilters()}});
document.addEventListener('submit',e=>{if(e.target.id==='home-search'){e.preventDefault();state.query=document.getElementById('query-home').value.trim();state.city=document.getElementById('city-home').value;nav('results')}if(e.target.id==='filter-form'){e.preventDefault();state.query=document.getElementById('filter-query').value.trim();state.cat=document.getElementById('filter-cat').value;state.city=document.getElementById('filter-city').value;state.min=document.getElementById('filter-min').value;state.max=document.getElementById('filter-max').value;if(state.min&&state.max&&Number(state.min)>Number(state.max)){notify('الحد الأدنى للسعر لا يمكن أن يكون أكبر من الحد الأقصى');return}draw();notify('تم تطبيق الفلاتر')}if(e.target.id==='post-form'){e.preventDefault();let form=e.target;if(!form.reportValidity())return;let title=document.getElementById('post-title').value.trim(),cat=document.getElementById('post-cat').value,city=document.getElementById('post-city').value,price=Number(document.getElementById('post-price').value),desc=document.getElementById('post-desc').value.trim();if(title.length<8||desc.length<20||price<=0){notify('يرجى إدخال جميع البيانات بصورة صحيحة');return}let img=({سيارات:'car',إلكترونيات:'laptop',عقارات:'home',أثاث:'sofa'})[cat]||'camera';let ad={id:Date.now(),title,category:cat,city,price,desc,img,seller:'أنت — إعلان تجريبي',date:'الآن'};state.custom.unshift(ad);localStorage.setItem('it352_listings',JSON.stringify(state.custom));notify('تم نشر الإعلان التجريبي بنجاح');nav('detail',ad.id)}if(e.target.id==='chat-form'){e.preventDefault();let input=document.getElementById('chat-text'),msg=input.value.trim();if(!msg)return;state.messages[state.chatId]??=[];state.messages[state.chatId].push(msg);localStorage.setItem('it352_messages',JSON.stringify(state.messages));draw();notify('تم إرسال الرسالة التجريبية')}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;draw()}});
window.addEventListener('hashchange',()=>{let [page,id]=location.hash.slice(1).split('/');if(['home','results','favorites','detail','post','messages'].includes(page)){state.page=page;if(page==='detail'&&id)state.selected=Number(id);draw()}});
let [initial,id]=location.hash.slice(1).split('/');if(['home','results','favorites','detail','post','messages'].includes(initial)){state.page=initial;if(id)state.selected=Number(id)}draw();
</script>
</body></html>
